bremersee:
  scs:
    pattern: ${SCS_PATTERN:/**}
    content-location: ${SCS_CONTENT_LOCATION:/opt/content/}
    default-index: ${SCS_INDEX:index.html}
    basic-auth-enabled: false
    server-access-role: ${ROLE_USER:}

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-headers: "*"
        allowed-methods: "*"
        allowed-origins: "*"
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

logging:
  level:
    ROOT: info
    com.netflix.eureka.registry: warn
    com.netflix.discovery.shared.resolver: warn
    org.springframework.cloud.configclient: warn
    org.bremersee.scs: debug

---

spring:
  config:
    activate:
      on-profile: in-memory

bremersee:
  authentication:
    in-memory:
      enabled: true
      users:
        - name: ${USER_NAME:actuator}
          password: ${USER_PASSWORD:changeit}
          authorities:
            - ${USER_ROLE:}
        - name: ${ADMIN_NAME:actuator}
          password: ${ADMIN_PASSWORD:changeit}
          authorities:
            - ROLE_ACTUATOR_ADMIN

---

spring:
  config:
    activate:
      on-profile: test

  security:
    user:
      name: actuator
      password: changeit
      roles:
        - "ACTUATOR_ADMIN"
